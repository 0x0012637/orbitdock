version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/orbitdock-web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      web-deps:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/orbitdock-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
