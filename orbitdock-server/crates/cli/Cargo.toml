[package]
name = "orbitdock"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "OrbitDock CLI - interact with AI coding sessions from the terminal"

[lib]
name = "orbitdock_cli"

[dependencies]
orbitdock-server = { workspace = true }
orbitdock-protocol = { workspace = true }
orbitdock-connector-codex = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
tokio-tungstenite = { version = "0.26", features = ["connect", "handshake"] }
comfy-table = "8"
console = "0.16"
toml = "1.1"
futures = { workspace = true }
urlencoding = "2"
clap_complete = "4"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
libc = { workspace = true }
signal-hook = "0.4"
chrono = { workspace = true }
